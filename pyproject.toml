[project]
name = "credit-engine"
version = "0.1.0"
description = "Explainable credit risk decisioning service"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Yazan Alkamal", email = "yazan@al-kamal.net" }]

# Phase 1 scope only: data, features, training, eval.
# FastAPI/SHAP arrive in Phase 3, per PHASES.md.
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "scikit-learn>=1.5,<2",
    "pyarrow>=17,<22",
    "matplotlib>=3.9,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5,<8",
    "ruff>=0.8,<0.16",
    "pre-commit>=4,<5",
    "kaggle>=2.2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_engine"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "slow: tests that touch the full dataset or train a model",
]

[tool.coverage.run]
source = ["src/credit_engine"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ANN",  # flake8-annotations  (CLAUDE.md: type hints are a quality bar)
    "S",    # flake8-bandit       (security posture is a project differentiator)
    "PTH",  # flake8-use-pathlib
    "RUF",
]
ignore = [
    "ANN401",  # allow typing.Any where genuinely needed
    "E501",    # line length is handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # assert is the point of a test
    "ANN201",  # test functions don't need return annotations
]
"notebooks/**" = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["credit_engine"]
